# Keeps electron-cast current on the cast branch: one PR per new release, merged once CI passes.
# Security updates for every dependency are not affected by this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: feat/chromecast
    schedule:
      interval: daily
    allow:
      - dependency-name: electron-cast
    commit-message:
      prefix: "⬆️"
    open-pull-requests-limit: 2
